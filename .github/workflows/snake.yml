name: Generate Snake

on:
  schedule: # ejecuta una vez al día
    - cron: "0 0 * * *"
  workflow_dispatch: # permite ejecutarlo manualmente
  push: # se ejecuta cuando hay cambios en la rama main
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: jairordtgz
          outputs: dist/github-contribution-grid-snake.svg
      - name: Push to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "Generate snake"
          add: "dist/*.svg"
